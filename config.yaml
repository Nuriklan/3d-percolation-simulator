# Experiment configuration for CNT percolation simulation
#
# Dimensionless / normalized units
# ─────────────────────────────────
# All lengths are in units of the CNT length L.
# Real mapping example:
#   L_real  = 1 μm   → length = 1.0
#   D_real  = 0.1 μm → diameter = 0.1   (AR = 10)
#   box_real = 10 μm → box.x   = 10.0
#
# At φ=0.005, box=10×5×5, L=1, D=0.1:
#   N ≈ φ·V_box / (π·D²·L/4) ≈ 159 tubes
#
# Phase 5 spatial acceleration:
#   method options: auto, grid (UniformSpatialGrid), hash (SpatialHashGrid),
#                   kdtree (cKDTree), brute_force

box:
  x: 10.0
  y: 5.0
  z: 5.0

cnt:
  length: 1.0
  diameter: 0.1
  orientation:
    mode: isotropic    # isotropic, aligned, partially_aligned, fisher
    axis: x            # preferred axis: x, y, z, or [dx, dy, dz]
    max_angle_deg: 90  # cone half-angle in degrees [0..90] (partially_aligned)
    kappa: 0.0         # concentration parameter >= 0 (fisher)

contact:
  threshold: 0.05
  method: auto   # auto, grid, hash, kdtree, brute_force
  tunneling:
    enabled: false      # set true to activate Phase 8 exponential tunneling model
    g0: 1.0             # direct-contact conductance G0 (S or normalized units)
    alpha: 50.0         # exponential decay constant alpha (1/um): G(d) = G0 * exp(-alpha * d_eff)
    d_min: 0.0          # direct-contact / van der Waals clamp distance (um)
    cutoff_distance: null  # optional override for maximum tunneling distance (um)
    min_conductance: null  # optional minimum conductance cutoff G_min (S)

simulation:
  concentrations:
    - 0.001
    - 0.002
    - 0.003
    - 0.004
    - 0.005
    - 0.006
    - 0.007
    - 0.008
  samples_per_concentration: 100
  random_seed: 42
